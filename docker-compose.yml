# Postgres para desenvolvimento local. Suba com `npm run db:up`.
services:
  postgres:
    image: postgres:17-alpine
    container_name: smartposte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartposte
      POSTGRES_PASSWORD: smartposte
      POSTGRES_DB: smartposte
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smartposte']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
